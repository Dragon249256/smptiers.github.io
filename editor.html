<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SMPTiers Editor</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #09121f;
        --panel: #111d2d;
        --panel-strong: #16263a;
        --line: #2a3f5f;
        --text: #e9edf5;
        --muted: #b8c4d7;
        --accent: #7dd3fc;
        --accent-strong: #38bdf8;
        --danger: #f87171;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      .container {
        width: min(1500px, calc(100% - 1.5rem));
        margin: 0 auto;
      }

      .site-header {
        padding: 2rem 0 1rem;
        border-bottom: 1px solid rgba(255,255,255,0.08);
        background: rgba(17, 29, 45, 0.85);
        backdrop-filter: blur(8px);
      }

      .header-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        flex-wrap: wrap;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 4vw, 3rem);
      }

      .header-actions {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
      }

      button,
      a.button-link {
        border: 1px solid var(--line);
        background: var(--panel-strong);
        color: var(--text);
        border-radius: 10px;
        padding: 0.7rem 1rem;
        cursor: pointer;
        font-size: 0.95rem;
        text-decoration: none;
        transition: 0.2s ease;
      }

      button:hover,
      a.button-link:hover {
        border-color: var(--accent);
        transform: translateY(-1px);
      }

      button.danger {
        border-color: rgba(248, 113, 113, 0.55);
      }

      .status {
        color: var(--muted);
        font-size: 0.9rem;
        min-height: 1.25rem;
      }

      .panel {
        margin-top: 1.5rem;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 1rem;
      }

      .table-wrap {
        overflow: auto;
        margin-top: 1rem;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 1100px;
      }

      th, td {
        border: 1px solid var(--line);
        padding: 0.55rem 0.5rem;
        text-align: left;
        vertical-align: middle;
      }

      th {
        background: rgba(125, 211, 252, 0.08);
        color: var(--accent);
        font-size: 0.82rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      input,
      select {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(10, 17, 28, 0.9);
        color: var(--text);
        padding: 0.55rem 0.6rem;
        font-size: 0.9rem;
      }

      input:focus,
      select:focus {
        outline: 2px solid rgba(56, 189, 248, 0.5);
        border-color: var(--accent);
      }

      .rank-col {
        width: 70px;
      }

      .player-col {
        min-width: 180px;
      }

      .tier-col {
        min-width: 130px;
      }

      footer {
        padding: 1.5rem 0 2rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="container header-row">
        <div>
          <p style="margin: 0 0 0.4rem; text-transform: uppercase; letter-spacing: 0.16em; color: var(--accent); font-size: 0.8rem;">Editor</p>
          <h1>SMPTiers Editor</h1>
        </div>
        <div class="header-actions">
          <a class="button-link" href="index.html">View public site</a>
          <button id="save-btn">Save changes</button>
          <button class="danger" id="reset-btn">Reset list</button>
        </div>
      </div>
    </header>

    <main class="container">
      <div class="panel">
        <div class="status" id="status">Ready.</div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th class="rank-col">Rank</th>
                <th class="player-col">Player</th>
                <th class="tier-col">Icon</th>
                <th class="tier-col">Emerald</th>
                <th class="tier-col">Emerald KB</th>
                <th class="tier-col">Diamond</th>
                <th class="tier-col">Diamond KB</th>
                <th class="tier-col">SMP</th>
                <th class="tier-col">Mace</th>
                <th class="tier-col">UHC</th>
                <th class="tier-col">Dragonhide KB</th>
              </tr>
            </thead>
            <tbody id="editor-body"></tbody>
          </table>
        </div>
      </div>
    </main>

    <footer>
      <div class="container">Changes are saved in your browser and shown on the public site.</div>
    </footer>

    <script>
      const kits = [
        'Emerald',
        'Emerald KB',
        'Diamond',
        'Diamond KB',
        'SMP',
        'Mace',
        'UHC',
        'Dragonhide KB'
      ];

      const avatarOptions = [
        { value: 'default', label: 'Default' },
        { value: 'mace', label: 'Mace' },
        { value: 'spear', label: 'Spear' },
        { value: 'lava', label: 'Lava bucket' },
        { value: 'sword', label: 'Diamond sword' }
      ];

      const storageKey = 'smptiers-rank-data';
      const statusEl = document.getElementById('status');
      const tbody = document.getElementById('editor-body');

      function makeBlankData() {
        return Array.from({ length: 60 }, (_, index) => ({
          rank: index + 1,
          player: '',
          avatar: 'default',
          kits: kits.reduce((acc, kit) => {
            acc[kit] = 'Unranked';
            return acc;
          }, {})
        }));
      }

      function loadData() {
        try {
          const raw = localStorage.getItem(storageKey);
          if (!raw) return makeBlankData();
          const parsed = JSON.parse(raw);
          if (!Array.isArray(parsed) || parsed.length === 0) return makeBlankData();

          return parsed.map((entry, index) => ({
            rank: index + 1,
            player: entry.player || '',
            avatar: avatarOptions.some((option) => option.value === entry.avatar) ? entry.avatar : 'default',
            kits: kits.reduce((acc, kit) => {
              acc[kit] = entry.kits && entry.kits[kit] ? String(entry.kits[kit]) : 'Unranked';
              return acc;
            }, {})
          }));
        } catch (error) {
          return makeBlankData();
        }
      }

      let data = loadData();

      function saveData() {
        localStorage.setItem(storageKey, JSON.stringify(data));
        statusEl.textContent = 'Saved locally.';
      }

      function renderEditor() {
        tbody.innerHTML = '';

        data.forEach((entry) => {
          const row = document.createElement('tr');

          const rankCell = document.createElement('td');
          rankCell.textContent = `#${entry.rank}`;
          row.appendChild(rankCell);

          const playerCell = document.createElement('td');
          const playerInput = document.createElement('input');
          playerInput.value = entry.player;
          playerInput.placeholder = 'Player name';
          playerInput.addEventListener('input', (event) => {
            entry.player = event.target.value;
            saveData();
          });
          playerCell.appendChild(playerInput);
          row.appendChild(playerCell);

          const avatarCell = document.createElement('td');
          const avatarSelect = document.createElement('select');
          avatarOptions.forEach((option) => {
            const opt = document.createElement('option');
            opt.value = option.value;
            opt.textContent = option.label;
            if (entry.avatar === option.value) {
              opt.selected = true;
            }
            avatarSelect.appendChild(opt);
          });
          avatarSelect.addEventListener('change', (event) => {
            entry.avatar = event.target.value;
            saveData();
          });
          avatarCell.appendChild(avatarSelect);
          row.appendChild(avatarCell);

          kits.forEach((kit) => {
            const cell = document.createElement('td');
            const input = document.createElement('input');
            input.value = entry.kits[kit] || 'Unranked';
            input.placeholder = 'Unranked';
            input.addEventListener('input', (event) => {
              entry.kits[kit] = event.target.value || 'Unranked';
              saveData();
            });
            cell.appendChild(input);
            row.appendChild(cell);
          });

          tbody.appendChild(row);
        });
      }

      document.getElementById('save-btn').addEventListener('click', () => {
        saveData();
        statusEl.textContent = 'Changes saved.';
      });

      document.getElementById('reset-btn').addEventListener('click', () => {
        if (confirm('Reset the entire ranking list?')) {
          data = makeBlankData();
          saveData();
          renderEditor();
          statusEl.textContent = 'List reset.';
        }
      });

      renderEditor();
    </script>
  </body>
</html>
